plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.10'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.23'
}

group = 'by.dzimash'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    ktorVersion = '3.2.1'
    koinVersion = '3.5.6'
    configVersion = '1.4.3'
}

dependencies {
    // Ktor Client for connecting to exchange APIs (REST and WebSocket)
    implementation "io.ktor:ktor-client-core:${ktorVersion}"
    implementation "io.ktor:ktor-client-cio:${ktorVersion}"
    implementation "io.ktor:ktor-client-websockets:${ktorVersion}"
    implementation "io.ktor:ktor-client-content-negotiation:${ktorVersion}"
    implementation "io.ktor:ktor-serialization-kotlinx-json-jvm:${ktorVersion}"

    // Kotlinx Coroutines for managing asynchronous operations
    implementation"org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"

    // Logging framework
    implementation 'ch.qos.logback:logback-classic:1.5.13'
    implementation 'io.ktor:ktor-client-cio-jvm:3.2.1'

    // Koin for Dependency Injection
    implementation "io.insert-koin:koin-core:${koinVersion}"
    implementation "io.insert-koin:koin-logger-slf4j:${koinVersion}"

    // HOCON for configuration files
    implementation "com.typesafe:config:${configVersion}"

    // Testing
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

test {
    useJUnitPlatform()
}
kotlin {
    jvmToolchain(21)
}